[project]
name = "self-learning-research-agent"
version = "0.1.0"
description = "An efficient deep research agent using LangGraph with free tools"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-google-genai>=4.4",
    "langchain-ollama>=1.1",
    "langchain-openai>=1.6",
    "ddgs>=9.16",
    "tavily-python>=0.8",
    "python-dotenv>=1.2",
    "beautifulsoup4>=4.15",
    "httpx>=0.28",
    "requests>=2.34",
    "markdown>=3.10",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "black>=24.10.0",
    "ruff>=0.8.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

